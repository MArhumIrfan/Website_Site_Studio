const url=u=>/^\s*(javascript|vbscript|data):/i.test(String(u||''))?'#':u;
const iurl=u=>/^\s*(javascript|vbscript):/i.test(String(u||''))||(/^\s*data:/i.test(String(u||''))&&!/^\s*data:image\//i.test(String(u||'')))?FB:u;
const img=(s,c,a='')=>`<img src="${esc(iurl(s))}" alt="${esc(a)}" loading="lazy" class="${c}" onerror="this.onerror=null;this.src='${FB}'">`;
const rgb=h=>{h=String(h).replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return x.map((v,i)=>Math.round(v+(y[i]-v)*t))};
const onCol=h=>{const[r,g,b]=rgb(h);return .299*r+.587*g+.114*b>150?[26,26,26]:[255,255,255]};
const loaded={};
const loadJS=u=>loaded[u]||(loaded[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete loaded[u];no()};document.head.appendChild(s)}));
const fontsDone={};
function loadFont(n){if(fontsDone[n])return;fontsDone[n]=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(n).replace(/%20/g,'+')+':ital,wght@0,400;0,600;0,700;1,400&display=swap';document.head.appendChild(l)}

const vurl=u=>!u||/^\s*(javascript|vbscript):/i.test(u)||(/^\s*data:/i.test(u)&&!/^\s*data:video\//i.test(u))?'':u;
const vmime=u=>{const m=/^data:(video\/[\w.+-]+)/i.exec(u);if(m)return m[1];const e=((u.split(/[?#]/)[0].match(/\.(\w+)$/))||[])[1];return({mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',ogv:'video/ogg',ogg:'video/ogg',mov:'video/quicktime'})[String(e).toLowerCase()]||''};
function videoEl(v){
 const u=String(v.url||'').trim(),a=!!v.autoplay,lp=!!v.loop,ctl=v.controls!==false,src=v.source||'auto',box='w-full aspect-video bg-black',
 yt=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/),vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/),
 emb=s=>`<iframe class="${box}" src="${esc(s)}" title="${esc(v.title||'Video')}" loading="lazy" allowfullscreen allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
 if((src==='youtube'||src==='auto')&&yt){const q=[a?'autoplay=1&mute=1':'',lp?'loop=1&playlist='+yt[1]:'',ctl?'':'controls=0','rel=0'].filter(Boolean).join('&');return emb('https://www.youtube-nocookie.com/embed/'+yt[1]+'?'+q)}
 if((src==='vimeo'||src==='auto')&&vm){const q=[a?'autoplay=1&muted=1':'',lp?'loop=1':'',ctl?'':'controls=0'].filter(Boolean).join('&');return emb('https://player.vimeo.com/video/'+vm[1]+(q?'?'+q:''))}
 const s1=vurl(u),s2=vurl(String(v.altUrl||'').trim());
 if(!s1&&!s2)return`<div class="${box} flex items-center justify-center text-white/60 text-sm"><i class="fa-solid fa-film mr-2"></i>Add a video link or upload a file</div>`;
 return`<video class="${box}" ${ctl?'controls':''} ${a?'autoplay':''} ${(a||v.muted)?'muted':''} ${lp?'loop':''} playsinline preload="metadata" ${v.poster?`poster="${esc(iurl(v.poster))}"`:''}>${[s1,s2].filter(Boolean).map(s=>`<source src="${esc(s)}"${vmime(s)?` type="${vmime(s)}"`:''}>`).join('')}Your browser cannot play this video.</video>`}

 plain:v=>`<div class="rounded-xl overflow-hidden shadow-xl">${v}</div>`,

function videoCard(v){

<label class="${lab}">Business name</label><input id="e-name" class="${i}">
<label class="${lab}">Colors</label><div class="grid grid-cols-4 gap-2 mb-2">${[['accent','Accent'],['accent2','Accent 2'],['lightBg','Light bg'],['darkBg','Dark bg']].map(c=>`<label class="text-center text-[10px] opacity-80">${c[1]}<input type="color" data-c="${c[0]}" class="e-col w-full h-8 rounded cursor-pointer bg-transparent"></label>`).join('')}</div>
<label class="${lab}">Heading font</label><select id="e-font" class="${i}">${FONTS.map(f=>`<option>${f}</option>`).join('')}</select>
<label class="${lab}">3D model</label><select id="e-model" class="${i}">${Object.entries(MODELS).map(m=>`<option value="${m[0]}">${m[1].label}</option>`).join('')}</select>
<label class="${lab}">Sections (show / hide / reorder)</label><div id="e-secs" class="mb-3"></div>
<label class="${lab}">Config (copy to save, paste to load)</label><textarea id="e-json" rows="5" class="${i} font-mono text-[10px]"></textarea>
<div class="flex gap-2"><button id="e-exp" class="flex-1 py-2 rounded-lg bg-a1 text-on font-bold">Export</button><button id="e-app" class="flex-1 py-2 rounded-lg bg-bg border border-ink/20 font-bold">Apply</button></div>
<button id="e-dl" class="w-full mt-3 py-2.5 rounded-lg bg-a2 text-white font-bold"><i class="fa-solid fa-download mr-1.5"></i>Download finished website</button>
<p class="opacity-60 mt-2 text-[10px] leading-snug">Saves one standalone .html file with all your changes and without this panel.</p>`;
 $('#e-preset').onchange=e=>{presetKey=e.target.value;cfg=clone(PRESETS[presetKey]);menuTab=0;applyTheme();render();syncEd()};
 let tm;$('#e-name').oninput=e=>{cfg.brand.name=e.target.value||' ';clearTimeout(tm);tm=setTimeout(render,450)};
 document.querySelectorAll('.e-col').forEach(el=>el.oninput=()=>{cfg.theme[el.dataset.c]=el.value;applyTheme()});
 $('#e-font').onchange=e=>{cfg.theme.fontHead=e.target.value;applyTheme()};
 $('#e-model').onchange=e=>{cfg.model3d.model=e.target.value;render()};
 $('#e-secs').onclick=e=>{const b=e.target.closest('[data-mv]');if(!b)return;const a=cfg.sections,x=a.findIndex(s=>s.id===b.dataset.mv),y=x+(+b.dataset.d);if(y<0||y>=a.length)return;[a[x],a[y]]=[a[y],a[x]];render();syncEd()};
 $('#e-secs').onchange=e=>{const s=cfg.sections.find(s=>s.id===e.target.dataset.id);if(s){s.on=e.target.checked;render()}};
 $('#e-exp').onclick=()=>{const t=$('#e-json');t.value=JSON.stringify(cfg,null,2);t.select();try{navigator.clipboard.writeText(t.value);toast('Config copied')}catch(x){toast('Config ready to copy')}};
 $('#e-app').onclick=()=>{try{cfg=merge(clone(CAFE),JSON.parse($('#e-json').value));menuTab=0;applyTheme();render();syncEd();toast('Config applied')}catch(x){toast('Invalid JSON: '+x.message)}};
 $('#e-dl').onclick=exportSite;
 $('#ed-btn').onclick=()=>$('#ed').classList.toggle('hidden');$('#ed-btn').classList.remove('hidden');
 syncEd();
}
/* Builds the final standalone site: current config baked in, editor removed. */
function buildExport(){
 const d=document.documentElement.cloneNode(true);
 d.querySelectorAll('style:not(#base-css)').forEach(n=>n.remove());
 d.querySelectorAll('script[src*="three"],script[src*="GLTFLoader"]').forEach(n=>n.remove());
 d.querySelector('#app').innerHTML='';
 ['#ed','#ed-btn'].forEach(q=>{const n=d.querySelector(q);if(n)n.remove()});
 const t=d.querySelector('#toast');t.textContent='';t.classList.add('translate-y-24','opacity-0');
 d.className='scroll-smooth';d.removeAttribute('style');
 const json=JSON.stringify(cfg).replace(/</g,'\\u003c');
 const sc=[...d.querySelectorAll('script:not([src])')].find(x=>x.textContent.includes('SHOW_EDITOR'));
 sc.textContent=('const EXPORTED_CFG='+json+';\n'+sc.textContent).replace(/const SHOW_EDITOR\s*=\s*\w+;/,()=>'const SHOW_EDITOR = false;');
 return '<!DOCTYPE html>\n'+d.outerHTML;
}
function exportSite(){
 try{
  const slug=(cfg.brand.name||'website').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'website';
  const url=URL.createObjectURL(new Blob([buildExport()],{type:'text/html'})),a=document.createElement('a');
  a.href=url;a.download=slug+'.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Downloaded '+slug+'.html');
 }catch(e){toast('Export failed: '+e.message)}
}
function syncEd(){
 $('#e-preset').value=presetKey;$('#e-name').value=cfg.brand.name;$('#e-font').value=cfg.theme.fontHead;$('#e-model').value=cfg.model3d.model;
 if(![...$('#e-font').options].some(o=>o.value===cfg.theme.fontHead)){$('#e-font').add(new Option(cfg.theme.fontHead));$('#e-font').value=cfg.theme.fontHead}
 document.querySelectorAll('.e-col').forEach(el=>el.value=cfg.theme[el.dataset.c]);
 $('#e-secs').innerHTML=cfg.sections.map((s,n)=>`<div class="flex items-center gap-2 py-1 border-b border-ink/10"><input type="checkbox" data-id="${s.id}" ${s.on?'checked':''} class="accent-[rgb(var(--a1))]"><span class="flex-1 capitalize">${s.id}</span><button data-mv="${s.id}" data-d="-1" class="px-1.5 opacity-70 hover:opacity-100" ${n===0?'disabled':''}>↑</button><button data-mv="${s.id}" data-d="1" class="px-1.5 opacity-70 hover:opacity-100" ${n===cfg.sections.length-1?'disabled':''}>↓</button></div>`).join('');
}

/* ============================================================
   7. BOOT
   ============================================================ */
document.documentElement.classList.toggle('dark',(store.get('site_mode')||cfg.theme.mode)==='dark');
applyTheme();render();
function unm(s){return String(s==null?'':s).replace(/\u2063[\u200b\u200c]+\u2064/g,'')}
function tagEdits(){const rx=/\u2063([\u200b\u200c]+)\u2064/g,w=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const m=[...n.nodeValue.matchAll(rx)];if(!m.length)return;const ids=m.map(x=>parseInt(x[1].replace(/\u200b/g,'0').replace(/\u200c/g,'1'),2));n.nodeValue=n.nodeValue.replace(rx,'');const el=n.parentElement;if(el)el.dataset.cp=(el.dataset.cp?el.dataset.cp+',':'')+ids.join(',')});
 document.querySelectorAll('#app *').forEach(el=>{for(const a of [...el.attributes])if(a.value.indexOf('\u2063')>-1)a.value=unm(a.value)})}
document.addEventListener('click',e=>{if(!editMode)return;const t=e.target;if(t.isContentEditable)return;e.preventDefault();e.stopPropagation();const el=t.closest('[data-cp]');if(!el)return;
 const ids=el.dataset.cp.split(',').map(Number),own=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue).join('').trim();
 if(ids.length>1||![...el.children].every(c=>/^(I|SVG)$/i.test(c.tagName))||own!==String(vals[ids[0]]).trim()){parent.postMessage({studioJump:ids[0]},'*');return}
 el.setAttribute('contenteditable','true');el.focus();el.onkeydown=k=>{if(k.key==='Enter'){k.preventDefault();el.blur()}};
 el.addEventListener('blur',()=>{el.removeAttribute('contenteditable');parent.postMessage({studioEditIdx:ids[0],value:el.textContent.trim()},'*')},{once:true})},true);
addEventListener('message',e=>{const d=e.data;if(d&&d.studioCfg){cfg=d.studioCfg;editMode=!!d.studioEdit;vals=d.studioVals||[];applyTheme();render()}if(d&&d.studioScroll){const x=document.getElementById(d.studioScroll);if(x)x.scrollIntoView({behavior:'smooth'})}}); // live preview from Site Studio
if(SHOW_EDITOR)buildEditor();
</script>
</body>
</html>
