<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#14110f;--pn:#1d1916;--ln:#352e29;--tx:#f1e9e0;--mu:#a39a90;--ac:#C98D53}
*{box-sizing:border-box}
body{margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.b{background:#2a241f;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-block;user-select:none}
.b:hover{border-color:var(--ac)}
.b[disabled]{opacity:.35;cursor:not-allowed;border-color:var(--ln)}
.b:focus-visible,.i:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b.p{background:var(--ac);color:#1a1209;font-weight:700;border:0}
.b.xs{padding:2px 6px;font-size:11px;border-radius:4px;line-height:1.4}
main{flex:1;display:flex;min-height:0}
#side{width:440px;min-width:240px;max-width:75vw;overflow:auto;padding:10px;background:var(--pn);border-right:1px solid var(--ln);flex-shrink:0;transition:width .08s}
#resizer{width:6px;cursor:col-resize;background:var(--pn);border-right:1px solid var(--ln);flex-shrink:0;position:relative;transition:background .15s}
#resizer::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:30px;background:var(--ln);border-radius:1px;transition:background .15s,height .15s}
#resizer:hover{background:#2a241f}
#resizer:hover::before{background:var(--ac);height:44px}
#resizer.dragging{background:var(--ac)}
#resizer.dragging::before{background:#1a1209}
#view{flex:1;display:flex;justify-content:center;background:#0c0a09;padding:10px;overflow:auto;min-width:0}
#wrap{width:100%;height:100%;background:#fff;border-radius:10px;overflow:hidden;transition:width .25s}
iframe{width:100%;height:100%;border:0}
details{border:1px solid var(--ln);border-radius:8px;margin:6px 0;background:rgba(255,255,255,.02)}
summary{cursor:pointer;padding:7px 10px;font-weight:600;text-transform:capitalize;display:flex;gap:6px;align-items:center}
.in{padding:4px 10px 8px}
label.f{display:block;margin:6px 0}
label.f>span{display:block;color:var(--mu);font-size:11px;margin-bottom:2px;text-transform:capitalize}
.i{width:100%;background:#120f0d;border:1px solid var(--ln);border-radius:6px;padding:6px 8px}
textarea.i{min-height:64px;resize:vertical}
.row{display:flex;gap:6px;align-items:center}
.sm{padding:2px 8px;font-size:12px}
.th{width:64px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
#welcome{position:fixed;inset:49px 0 0 0;background:var(--bg);display:none;z-index:5;overflow-y:auto}
#welcome.show{display:flex}
#drop{margin:auto;text-align:center;padding:30px;max-width:780px;line-height:1.6;width:100%}
.preset-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:22px;text-align:left}
.pcard{background:linear-gradient(145deg,#2a241f,#1d1916);border:1px solid var(--ln);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--ac);transform:translateY(-3px)}
.pcard .emoji{font-size:24px;display:block;margin-bottom:6px}
.pcard .name{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:3px}
.pcard .tag{font-size:11px;color:var(--mu);line-height:1.4}
.pcard .swatch{position:absolute;top:10px;right:10px;display:flex;gap:3px}
.pcard .swatch span{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:#1a1209;padding:8px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90vw;text-align:center}
.hint{color:var(--mu);font-size:11px;margin-top:4px;display:block}
.pcard.blank{border-style:dashed;background:transparent}
.pcard.blank:hover{border-style:solid;background:linear-gradient(145deg,#2a241f,#1d1916)}

/* Sections panel */
#sections-panel{margin-bottom:10px;border:1px solid var(--ln);border-radius:8px;background:#1a1614;overflow:hidden}
#sections-panel .panel-head{padding:8px 10px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);background:#221c17;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}
#sections-panel .panel-head i{color:var(--ac)}
.section-list{max-height:340px;overflow-y:auto}
.section-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--ln);font-size:12px;transition:background .12s}
.section-row:last-child{border-bottom:0}
.section-row:hover{background:#221c17}
.section-row.dragging{opacity:.35}
.section-row.drag-over{box-shadow:inset 0 2px 0 var(--ac)}
.section-row .drag-handle{color:var(--mu);cursor:grab;padding:0 2px;font-size:11px;letter-spacing:-2px}
.section-row .drag-handle:active{cursor:grabbing}
.section-row .sec-name{flex:1;text-transform:capitalize;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.section-row.hidden-section .sec-name{opacity:.4;text-decoration:line-through}
.section-row .sec-actions{display:flex;gap:2px;flex-shrink:0}
.section-row .sec-actions .b{background:#221c17;padding:2px 6px;font-size:11px;border-radius:4px;line-height:1.4}
.section-row .sec-actions .b:hover:not([disabled]){background:#2f2721}
</style>
</head>
<body>
<header>
 <b style="font-size:15px"><i class="fa-solid fa-sliders" style="color:var(--ac)"></i> Site Studio</b>
 <label class="b">Open template<input id="f-tpl" type="file" accept=".html,.htm" hidden></label>
 <select id="preset" class="b" title="Load a preset"></select>
 <button class="b" id="undo" title="Undo" aria-label="Undo">↶</button><button class="b" id="redo" title="Redo" aria-label="Redo">↷</button>
 <label class="b">Load project<input id="f-proj" type="file" accept=".json" hidden></label>
 <button class="b" id="save">Save project</button>
 <span id="sv" style="color:var(--mu);font-size:11px" aria-live="polite"></span>
 <span style="flex:1"></span>
 <button class="b" id="editbtn" aria-pressed="true" title="Click text in the preview to edit it" aria-label="Toggle click-to-edit in preview" style="border-color:var(--ac)"><i class="fa-solid fa-pen-to-square"></i></button>
 <button class="b" data-w="100%" title="Desktop" aria-label="Desktop preview"><i class="fa-solid fa-desktop"></i></button>
 <button class="b" data-w="820px" title="Tablet" aria-label="Tablet preview"><i class="fa-solid fa-tablet-screen-button"></i></button>
 <button class="b" data-w="390px" title="Phone" aria-label="Phone preview"><i class="fa-solid fa-mobile-screen"></i></button>
 <button class="b p" id="export"><i class="fa-solid fa-download"></i> Export website</button>
</header>
<main>
 <div id="side">
   <div id="sections-panel">
     <div class="panel-head"><i class="fa-solid fa-list-ul"></i> Sections <span style="flex:1"></span><span style="font-size:10px;opacity:.7">drag · arrows · ✕</span></div>
     <div class="section-list" id="sectionList"></div>
   </div>
   <div id="tree"></div>
 </div>
 <div id="resizer" title="Drag to resize · double-click to collapse"></div>
 <div id="view"><div id="wrap"><iframe id="fr" title="Live preview"></iframe></div></div>
</main>
<div id="welcome"><div id="drop">
 <h2 style="margin-top:0">Start a new site</h2>
 <p>Pick an industry preset to begin — everything is fully editable. You can also drop in your own modular template or a project file you saved earlier.</p>
 <div class="preset-cards" id="presetCards"></div>
 <p class="hint" style="margin-top:22px">Or <label class="b" style="display:inline-block">choose your own template file<input id="f-first" type="file" accept=".html,.htm" hidden></label> · <label class="b" style="display:inline-block">load a saved project<input id="f-first-proj" type="file" accept=".json" hidden></label></p>
</div></div>
<div id="msg"></div>
<div id="dlg" style="display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center"><div role="dialog" aria-modal="true" style="background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:380px"><p id="dlg-t" style="margin-top:0;line-height:1.5"></p><div class="row" style="justify-content:flex-end"><button class="b" id="dlg-n">Cancel</button><button class="b p" id="dlg-y">Yes, replace</button></div></div></div>
<datalist id="fonts"><option>Playfair Display<option>Cormorant Garamond<option>DM Serif Display<option>Oswald<option>Poppins<option>Inter<option>Lora<option>Montserrat<option>Raleway<option>Merriweather<option>Bebas Neue<option>Roboto Slab<option>Pacifico<option>Space Grotesk<option>Fraunces<option>Outfit<option>Manrope</datalist>
<datalist id="ids"><option>hero<option>model3d<option>about<option>menu<option>team<option>reviews<option>gallery<option>events<option>video<option>faq<option>contact<option>location<option>custom</datalist>

/* ══════════════════════════════════════════════════════════════════
   ROBUST PARSER
   ══════════════════════════════════════════════════════════════════ */
function findFunction(src, name){
  const idx = src.indexOf('function ' + name);
  if(idx < 0) return null;
  const braceStart = src.indexOf('{', idx);
  if(braceStart < 0) return null;
  let depth = 0, i = braceStart, inStr = false, strCh = '', esc2 = false;
  for(; i < src.length; i++){
    const c = src[i];
    if(inStr){
      if(esc2){ esc2 = false; continue; }
      if(c === '\\'){ esc2 = true; continue; }
      if(c === strCh) inStr = false;
      continue;
    }
    if(c === '"' || c === "'" || c === '`'){ inStr = true; strCh = c; continue; }
    if(c === '{') depth++;
    else if(c === '}'){ depth--; if(depth === 0) return src.slice(idx, i + 1); }
  }
  return null;
}
function extractBlock(js, startMarker){
  const start = js.indexOf(startMarker);
  if(start < 0) return null;
  const eqIdx = js.indexOf('=', start);
  if(eqIdx < 0) return null;
  let i = eqIdx + 1, depth = 0, inStr = false, strCh = '', esc2 = false;
  while(i < js.length){
    const c = js[i];
    if(inStr){
      if(esc2){ esc2 = false; i++; continue; }
      if(c === '\\'){ esc2 = true; i++; continue; }
      if(c === strCh) inStr = false;
      i++; continue;
    }
    if(c === '"' || c === "'" || c === '`'){ inStr = true; strCh = c; i++; continue; }
    if(c === '{' || c === '[' || c === '(') depth++;
    else if(c === '}' || c === ']' || c === ')') depth--;
    else if(c === ';' && depth === 0){ i++; break; }
    i++;
  }
  return js.slice(start, i);
}
function parse(text){
  // Accepts both plain and escaped script-closing tags in the input
  const scripts = [...text.matchAll(/<script>([\s\S]*?)<\\?\/script>/g)].map(m => m[1]);
  const js = scripts.find(x => x.includes('const CAFE') && x.includes('const PRESETS'));
  if(!js) throw new Error('This is not the modular template (or an export of it). Missing CAFE/PRESETS.');
  const cafeBlock = extractBlock(js, 'const CAFE');
  const presetsBlock = extractBlock(js, 'const PRESETS');
  if(!cafeBlock || !presetsBlock) throw new Error('Could not find CAFE or PRESETS in the template.');
  const mergeFn = findFunction(js, 'merge');
  if(!mergeFn) throw new Error('Could not find the merge() function.');
  const code = mergeFn + ';\n' + cafeBlock + ';\n' + presetsBlock + ';\nreturn {CAFE,PRESETS};';
  let result;
  try { result = new Function(code)(); }
  catch(e){ throw new Error('Template config is invalid: ' + e.message); }
  let ex = null;
  const exm = text.match(/(?:^|<script>)\s*const EXPORTED_CFG\s*=\s*([\s\S]*?);\s*\n/);
  if (exm) {
    try { ex = JSON.parse(exm[1]); }
    catch (e) { console.warn('Ignoring embedded config (invalid JSON):', e.message); }
  }
  return { P: result.PRESETS, C: result.CAFE, ex };
}

const LT = '<', TAG_OPEN = LT + 'script>', TAG_CLOSE = LT + '/script>', SEO_A = LT + '!--seo-->', SEO_B = LT + '!--/seo-->';

  const ld={'@context':'https://schema.org','@type':s.type||'WebSite',name:c.brand.name,description:desc,address:c.location&&c.location.address,image:im||undefined};
  const meta=n=>LT+'meta '+n+'>';
  return SEO_A+meta('name="description" content="'+esc(desc)+'"')+meta('property="og:title" content="'+esc(c.brand.name)+'"')+meta('property="og:description" content="'+esc(desc)+'"')
   +(im?meta('property="og:image" content="'+esc(im)+'"'):'')+meta('name="theme-color" content="'+esc(c.theme.accent)+'"')
   +LT+'script type="application/ld+json">'+JSON.stringify(ld).replace(new RegExp(LT,'g'),'\\u003c')+TAG_CLOSE+SEO_B;

function build(c){
  const j = JSON.stringify(c).replace(new RegExp(LT,'g'), '\\u003c');
  let out = src;
  // Remove any old EXPORTED_CFG line
  out = out.replace(/(^|<script>)const EXPORTED_CFG=.*;\n/m, (m,a) => a);
  // Insert new config right after SHOW_EDITOR
  out = out.replace(/const SHOW_EDITOR\s*=\s*\w+;/, () => `const EXPORTED_CFG=${j};\nconst SHOW_EDITOR = false;`);

  out = out.replace(new RegExp(SEO_A + '[\\s\\S]*?' + SEO_B), '').replace('</head>', () => seoTags(c) + '</head>');
  return out;
}

function normalizeOrder(c){
  if(!c) return c;
  // Ensure _order exists and only contains valid sections present in the config
  let order = Array.isArray(c._order) ? c._order.slice() : [];
  // Remove any keys not in ALL_SECTIONS or missing from cfg
  order = order.filter(k => ALL_SECTIONS.includes(k) && c[k]);
  // Append any sections that exist in cfg but weren't in _order
  ALL_SECTIONS.forEach(k => { if(c[k] && !order.includes(k)) order.push(k); });
  c._order = order;
  return c;
}

function loadTemplate(text, keepCfg){
  const r = parse(text);
  src = text;

  Object.keys(PRES).forEach(k => normalizeOrder(PRES[k]));
  normalizeOrder(r.C);
  const keys = Object.keys(PRES);
  $('#preset').innerHTML = '<option value="">Load preset…</option>' + keys.map(k => `<option>${esc(k)}</option>`).join('');

function renderSections(){
  if(!cfg) return;
  if(!Array.isArray(cfg._order)) cfg._order = ALL_SECTIONS.filter(k => cfg[k]);
  const order = cfg._order;
  const list = $('#sectionList');
  if(!list) return;

  const rows = order.map((k, i) => {
    if(!cfg[k]) return '';
    const hidden = cfg[k].on === false;
    return `<div class="section-row ${hidden ? 'hidden-section' : ''}" data-key="${k}" draggable="true">
      <span class="drag-handle">⋮⋮</span>
      <span class="sec-name">${esc(SECTION_LABELS[k] || k)}</span>
      <span class="sec-actions">
        <button class="b xs" data-sec-act="up" data-sec-key="${k}" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
        <button class="b xs" data-sec-act="down" data-sec-key="${k}" ${i === order.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
        <button class="b xs" data-sec-act="toggle" data-sec-key="${k}" title="${hidden ? 'Show section' : 'Hide section'}">${hidden ? '👁' : '👁'}</button>
        <button class="b xs" data-sec-act="remove" data-sec-key="${k}" title="Remove from layout">✕</button>
      </span>
    </div>`;
  }).join('');

  const hidden = ALL_SECTIONS.filter(k => !order.includes(k));
  const addRow = hidden.length ? `<div class="row" style="padding:8px">
      <select class="i" id="addSectionSelect" style="flex:1">
        <option value="">Add section…</option>
        ${hidden.map(k => `<option value="${k}">${SECTION_LABELS[k] || k}</option>`).join('')}
      </select>
      <button class="b sm" id="addSectionBtn">Add</button>
    </div>` : '';

  list.innerHTML = rows + addRow;

  // Click handler (delegated once)
  if(!list.__wired){
    list.__wired = true;
    list.addEventListener('click', ev => {
      const btn = ev.target.closest('[data-sec-act]');
      if(btn){
        ev.preventDefault();
        handleSectionAction(btn.dataset.secKey, btn.dataset.secAct);
        return;
      }
      if(ev.target.id === 'addSectionBtn' || ev.target.closest('#addSectionBtn')){
        const sel = $('#addSectionSelect');
        if(sel && sel.value){ addSection(sel.value); }
      }
    });
    // Drag to reorder
    let dragKey = null;
    list.addEventListener('dragstart', ev => {
      const row = ev.target.closest('.section-row');
      if(!row) return;
      dragKey = row.dataset.key;
      row.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'move';
      try { ev.dataTransfer.setData('text/plain', dragKey); } catch(e){}
    });
    list.addEventListener('dragend', ev => {
      list.querySelectorAll('.section-row').forEach(r => r.classList.remove('dragging','drag-over'));
      dragKey = null;
    });
    list.addEventListener('dragover', ev => {
      if(!dragKey) return;
      const row = ev.target.closest('.section-row');
      if(!row || row.dataset.key === dragKey) return;
      ev.preventDefault();
      list.querySelectorAll('.section-row').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    list.addEventListener('drop', ev => {
      ev.preventDefault();
      const row = ev.target.closest('.section-row');
      list.querySelectorAll('.section-row').forEach(r => r.classList.remove('drag-over'));
      if(!row || !dragKey || row.dataset.key === dragKey) return;
      const order = cfg._order;
      const from = order.indexOf(dragKey);
      const to = order.indexOf(row.dataset.key);
      if(from < 0 || to < 0) return;
      order.splice(from, 1);
      order.splice(to, 0, dragKey);
      dragKey = null;
      renderSections(); drawTree(); dirty(true);
      msg('Reordered · ' + (SECTION_LABELS[row.dataset.key] || row.dataset.key));
    });
  }
}

function handleSectionAction(key, action){
  if(!cfg || !Array.isArray(cfg._order)) return;
  const order = cfg._order;
  const i = order.indexOf(key);
  if(i < 0) return;
  if(action === 'up' && i > 0){
    [order[i-1], order[i]] = [order[i], order[i-1]];
  } else if(action === 'down' && i < order.length - 1){
    [order[i+1], order[i]] = [order[i], order[i+1]];
  } else if(action === 'toggle'){
    if(!cfg[key]) cfg[key] = {on:true};
    cfg[key].on = cfg[key].on === false ? true : false;
  } else if(action === 'remove'){
    order.splice(i, 1);
    msg('Removed from layout · ' + (SECTION_LABELS[key] || key), 'trash');
  }
  renderSections(); drawTree(); dirty(true);
}

function addSection(key){
  if(!cfg || !ALL_SECTIONS.includes(key)) return;
  if(!Array.isArray(cfg._order)) cfg._order = [];
  if(!cfg[key]){
    // Create default section object based on type
    if(key === 'menu') cfg[key] = {on:true, title:'What we offer', items:[{name:'Item', desc:'Describe this offering', price:'$0', tag:'New'}]};
    else if(key === 'team') cfg[key] = {on:true, title:'Meet the team', members:[{name:'Name', role:'Role', img:''}]};
    else if(key === 'reviews') cfg[key] = {on:true, title:'What people say', items:[{text:'Amazing!', author:'Happy client'}]};
    else if(key === 'gallery') cfg[key] = {on:true, title:'Gallery', images:[{img:'', caption:''}]};
    else if(key === 'video') cfg[key] = {on:true, title:'Watch', videos:[{url:'', frame:'rounded'}]};
    else if(key === 'faq') cfg[key] = {on:true, title:'Common questions', items:[{q:'Question?', a:'Answer.'}]};
    else if(key === 'model3d') cfg[key] = {on:true, model:'glb', title:'Interactive model', glbUrl:''};
    else if(key === 'contact') cfg[key] = {on:true, title:'Get in touch', phone:'', email:'', hours:''};
    else if(key === 'hero') cfg[key] = {on:true, title:'Hello', subtitle:'Welcome', primaryBtn:'Get started', primaryUrl:'#contact', secondaryBtn:'', secondaryUrl:'', heroImg:''};
    else if(key === 'about') cfg[key] = {on:true, title:'About us', p1:'Tell your story here.', p2:''};
  } else {
    cfg[key].on = true;
  }
  if(!cfg._order.includes(key)) cfg._order.push(key);
  renderSections(); drawTree(); dirty(true);
  msg('Added · ' + (SECTION_LABELS[key] || key));
}

 else if(/^font/.test(k))h=`<input class="i" list="fonts" ${a} data-t="s" value="${esc(v)}">`;
 else if(String(v).length>70||/^(text|desc|quote|p1|p2|html|customCss)$/.test(k))h=`<textarea class="i" ${a} data-t="s" rows="${/^(html|customCss)$/.test(k)?8:3}">${esc(v)}</textarea>`;
 else h=`<input class="i" ${a} data-t="s" value="${esc(v)}" ${k==='id'?'list="ids"':''}>`;
 return showLabel?`<label class="f"><span>${esc(lab(k))}</span>${h}</label>`:`<div style="flex:1;min-width:90px">${h}</div>`;
}
const isPrim=v=>v===null||typeof v!=='object';
function body(v,p){return Object.keys(v).map(k=>child(v[k],[...p,k])).join('')}
function child(v,p){
 if(isPrim(v))return field(v,p);
 const o=p.join('.');
 return`<details data-o="${esc(o)}" ${opened.has(o)?'open':''}><summary>${esc(lab(p[p.length-1]))}</summary><div class="in">${Array.isArray(v)?list(v,p):body(v,p)}</div></details>`;
}
function list(v,p){
 if(v.every(isPrim))return`<div class="row" style="flex-wrap:wrap">${v.map((x,i)=>field(x,[...p,i],false)).join('')}</div>`;
 return v.map((it,i)=>{const q=[...p,i],o=q.join('.'),btn=(a,t,ti)=>`<span class="b sm" data-a="${a}" data-p="${pa(p)}" data-i="${i}" title="${ti}">${t}</span>`;
  return`<details data-o="${esc(o)}" ${opened.has(o)?'open':''}><summary><span class="b sm" draggable="true" data-drag="${esc(o)}" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</span>${esc(summ(it,i))}<span style="flex:1"></span>${btn('up','↑','Move up')}${btn('down','↓','Move down')}${btn('dup','⧉','Duplicate')}${btn('del','✕','Delete')}</summary><div class="in">${isPrim(it)?field(it,q,false):Array.isArray(it)?list(it,q):body(it,q)}</div></details>`}).join('')
  +`<button class="b sm" data-a="add" data-p="${pa(p)}">+ Add</button>`;
}
function drawTree(){
 const t=$('#tree'),st=$('#side').scrollTop;
 t.innerHTML=Object.keys(cfg).filter(k => k !== '_order').map(k=>child(cfg[k],[k])).join('');
 $('#side').scrollTop=st;
}

/* ══════════════════════════════════════════════════════════════════
   EDIT, HISTORY, PREVIEW
   ══════════════════════════════════════════════════════════════════ */
function snap(){const s=JSON.stringify(cfg);if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);while(hist.length>(s.length>8e6?4:30))hist.shift();hi=hist.length-1}
let editOn=true,paths=[];
const SKIPK=/^(id|model|board|glbUrl|href|url|img|image|icon|badgeIcon|extraIcon|mode|fontHead|fontBody|customCss|html|type|endpoint|email|subject|key|altUrl|poster|source|frame|titlePos|_order)$/i;
function markCfg(){const ps=[],w=(v,p)=>{
  if(typeof v==='string'){if(!v||SKIPK.test(String(p[p.length-1]))||p[0]==='theme'||p[0]==='seo'||/^(https?:|#|data:)/.test(v))return v;
   const n=ps.push(p)-1;return'\u2063'+n.toString(2).replace(/0/g,'\u200b').replace(/1/g,'\u200c')+'\u2064'+v}
  if(Array.isArray(v))return v.map((x,i)=>w(x,[...p,i]));
  if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=w(v[k],[...p,k]);return o}return v};
 return{cfg:w(cfg,[]),paths:ps}}
function preview(){if(!frLoaded)return;let c=cfg;if(editOn){const m=markCfg();c=m.cfg;paths=m.paths}
 $('#fr').contentWindow.postMessage({studioCfg:c,studioEdit:editOn,studioVals:editOn?paths.map(p=>get(p)):[]},'*')}
function reveal(p){for(let i=1;i<=p.length;i++)opened.add(p.slice(0,i).join('.'));drawTree();
 const el=[...document.querySelectorAll('[data-p]')].find(x=>x.dataset.p===JSON.stringify(p));
 if(el){el.scrollIntoView({block:'center'});el.focus()}}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||e.source!==$('#fr').contentWindow)return;
 if('studioEditIdx' in d){const p=paths[d.studioEditIdx];if(p&&typeof d.value==='string'){set(p,d.value);drawTree();dirty(true)}}
 else if('studioJump' in d){const p=paths[d.studioJump];if(p){reveal(p);msg('This text is edited in the form')}}});
$('#editbtn').onclick=()=>{editOn=!editOn;const b=$('#editbtn');b.setAttribute('aria-pressed',editOn);b.style.borderColor=editOn?'var(--ac)':'';preview();msg(editOn?'Click-to-edit ON: click text in the preview':'Click-to-edit OFF: preview links and buttons work')};
const ask=t=>new Promise(ok=>{$('#dlg-t').textContent=t;const D=$('#dlg');D.style.display='flex';$('#dlg-y').focus();const done=v=>{D.style.display='none';ok(v)};$('#dlg-y').onclick=()=>done(true);$('#dlg-n').onclick=()=>done(false)});
let dragO=null;
$('#tree').addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;dragO=h.dataset.drag;if(e.dataTransfer){e.dataTransfer.setData('text/plain',dragO);e.dataTransfer.effectAllowed='move'}});
$('#tree').addEventListener('dragover',e=>{if(dragO&&e.target.closest('details[data-o]'))e.preventDefault()});
$('#tree').addEventListener('drop',e=>{const t=e.target.closest('details[data-o]');if(!dragO||!t)return;e.preventDefault();
 const a=dragO.split('.'),b=t.dataset.o.split('.');dragO=null;
 if(a.length!==b.length||a.slice(0,-1).join('.')!==b.slice(0,-1).join('.'))return;
 const arr=get(a.slice(0,-1)),i=+a[a.length-1],j=+b[b.length-1];if(i===j||!Array.isArray(arr))return;
 arr.splice(j,0,arr.splice(i,1)[0]);drawTree();dirty(true)});
function dirty(now){clearTimeout(tm);tm=setTimeout(()=>{snap();preview();save()},now?0:350)}
$('#fr').onload=()=>{frLoaded=true;preview()};
const tree=$('#tree');
tree.addEventListener('toggle',e=>{const o=e.target.dataset&&e.target.dataset.o;if(o)e.target.open?opened.add(o):opened.delete(o)},true);
tree.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 const v=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?(+t.value||0):t.value;
 set(JSON.parse(p),v);if(t.type==='color'&&t.nextElementSibling)t.nextElementSibling.textContent=v;
 const pp=JSON.parse(p);if(pp[0]==='theme'&&/^#[0-9a-f]{6}$/i.test(v)){const T=cfg.theme;try{const lo=ratio(T.accent,T.lightBg),dk=ratio(T.accent,T.darkBg);if(lo<3||dk<3)msg('⚠ Low contrast: accent is hard to read on '+(lo<3&&dk<3?'both backgrounds':lo<3?'light background':'dark background')+' ('+Math.min(lo,dk).toFixed(1)+':1, aim 3+).')}catch(x){}}
 dirty()});
tree.addEventListener('click',e=>{const s=e.target.closest('summary');if(!s||e.target.closest('[data-a]'))return;const d=s.parentElement,o=d.dataset.o;
 if(o&&o.indexOf('.')<0&&!d.open&&frLoaded)$('#fr').contentWindow.postMessage({studioScroll:o},'*')});
tree.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
 const arr=get(JSON.parse(b.dataset.p)),i=+b.dataset.i,a=b.dataset.a;
 if(a==='add')arr.push(arr.length?clone(arr[arr.length-1]):'');
 else if(a==='dup')arr.splice(i+1,0,clone(arr[i]));
 else if(a==='del'){if(arr.length<2)return msg('Keep at least one item.');arr.splice(i,1)}
 else if(a==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
 else if(a==='down'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
 drawTree();dirty(true)});
tree.addEventListener('change',async e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;const f=t.files[0];
 msg('Processing file…');
 set(JSON.parse(t.dataset.up),(/^image\//.test(f.type)&&f.type!=='image/svg+xml')?await shrink(f):await readURL(f));
 drawTree();dirty(true);msg(f.size>(/^video\//.test(f.type)?5e6:3e6)?'⚠ '+(f.size/1e6).toFixed(1)+' MB embedded: adds ~33% and makes the page heavy. For videos, host the file (or use YouTube/Vimeo) and paste the link instead.':'File embedded')});

function restore(){cfg=JSON.parse(hist[hi]);normalizeOrder(cfg);drawTree();renderSections();preview()}
$('#undo').onclick=()=>{snap();if(hi>0){hi--;restore()}};
$('#redo').onclick=()=>{if(hi<hist.length-1){hi++;restore()}};
$('#preset').onchange=async e=>{const k=e.target.value;e.target.value='';if(k&&await ask('Replace ALL current content with the "'+k+'" preset? You can undo this.')){cfg=normalizeOrder(clone(PRES[k]));renderSections();drawTree();dirty(true)}};
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>$('#wrap').style.width=b.dataset.w);
$('#export').onclick=()=>{if(!cfg)return msg('Open the template first');download(slug()+'.html',build(cfg),'text/html');msg('Exported '+slug()+'.html')};
$('#save').onclick=()=>{if(!cfg)return msg('Open the template first');download(slug()+'.project.json',JSON.stringify(cfg,null,2),'application/json');msg('Project saved')};
$('#f-proj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cfg)return msg('Open the template first');
 try{cfg=normalizeOrder(merge(clone(PRES[Object.keys(PRES)[0]]),JSON.parse(await readText(f))));renderSections();drawTree();dirty(true);msg('Project loaded')}catch(x){msg('Invalid project file: '+x.message)}};

/* ══════════════════════════════════════════════════════════════════
   FILE OPENING
   ══════════════════════════════════════════════════════════════════ */
async function openFile(f){if(!f)return;try{loadTemplate(await readText(f))}catch(x){alert(x.message)}}
$('#f-tpl').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
$('#f-first').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
$('#f-first-proj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
   if(!src){
     src=DEFAULT_TEMPLATE;const r=parse(src);PRES=r.P;
     Object.keys(PRES).forEach(k=>normalizeOrder(PRES[k]));
     normalizeOrder(r.C);
     const keys=Object.keys(PRES);$('#preset').innerHTML='<option value="">Load preset…</option>'+keys.map(k=>`<option>${esc(k)}</option>`).join('');
   }
   const parsed=JSON.parse(await readText(f));
   cfg=normalizeOrder(merge(clone(PRES[Object.keys(PRES)[0]]),parsed));
   $('#welcome').classList.remove('show');
   hist=[];hi=-1;snap();drawTree();renderSections();frLoaded=false;$('#fr').srcdoc=build(cfg);
   msg('Project loaded');
 }catch(x){msg('Invalid project file: '+x.message)}};

addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)openFile(f)});
addEventListener('beforeunload',e=>{if(cfg&&hi>0){e.preventDefault();e.returnValue=''}});

/* ══════════════════════════════════════════════════════════════════
   SIDEBAR RESIZER
   ══════════════════════════════════════════════════════════════════ */
(function setupResizer(){
  const side = $('#side');
  const resizer = $('#resizer');
  if(!side || !resizer) return;
  let dragging = false, startX = 0, startW = 0;
  const saved = store.get('studio_side_w');
  if(saved && saved.endsWith('px')) side.style.width = saved;

  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = side.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if(!dragging) return;
    const w = Math.max(240, Math.min(startW + (e.clientX - startX), window.innerWidth - 220));
    side.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    store.set('studio_side_w', side.style.width);
  });
  resizer.addEventListener('dblclick', () => {
    const isCollapsed = side.style.width === '0px';
    side.style.width = isCollapsed ? (store.get('studio_side_w_before') || '440px') : '0px';
    if(isCollapsed){
      store.set('studio_side_w', side.style.width);
    } else {
      store.set('studio_side_w_before', side.style.width);
      store.set('studio_side_w', '0px');
    }
  });
  // Touch
  resizer.addEventListener('touchstart', e => {
    dragging = true;
    startX = e.touches[0].clientX;
    startW = side.getBoundingClientRect().width;
    resizer.classList.add('dragging');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(!dragging) return;
    const w = Math.max(240, Math.min(startW + (e.touches[0].clientX - startX), window.innerWidth - 220));
    side.style.width = w + 'px';
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    store.set('studio_side_w', side.style.width);
  });
})();

/* ══════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════ */
(async function boot(){
  // 1. Always load the built-in default first
  try{
    loadTemplate(DEFAULT_TEMPLATE);
  }catch(x){
    console.error('Failed to load default template:', x);
    alert('Could not load the default template.\n\n' + x.message + '\n\nOpen the browser console (F12) for details.');
    return;
  }

  // 2. Try to overlay a saved session — but never let a broken template win
  try{
    const savedSrc = store.get(STORAGE_KEY_SRC);
    if(savedSrc && savedSrc !== DEFAULT_TEMPLATE){
      try{
        const r = parse(savedSrc);
        if(r && Object.keys(r.P).length > 0){
          src = savedSrc;
          PRES = r.P;
          Object.keys(PRES).forEach(k => normalizeOrder(PRES[k]));
          normalizeOrder(r.C);
          const keys = Object.keys(PRES);
          $('#preset').innerHTML = '<option value="">Load preset…</option>' + keys.map(k => `<option>${esc(k)}</option>`).join('');
        }
      }catch(e){ /* stale template — keep the built-in one */ }
    }
    const savedCfg = store.get(STORAGE_KEY_CFG);
    if(savedCfg){
      const c = JSON.parse(savedCfg);
      if(c && c.brand){
        cfg = normalizeOrder(merge(clone(PRES[Object.keys(PRES)[0]]), c));
        drawTree();
        renderSections();
        frLoaded = false;
        $('#fr').srcdoc = build(cfg);
      }
    }
  }catch(e){}

  // 3. Show the welcome screen with preset cards
  $('#welcome').classList.add('show');
  renderPresetCards();
  renderSections();
})();
</script>
